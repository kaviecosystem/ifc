<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invest For Your Friend/Customer</title>
<style>
  html,body{margin:0;height:100%;background:#0b1811;overflow:hidden;}
  #__subtab{
    position:fixed;top:0;left:0;right:0;height:50px;z-index:100;
    display:flex;gap:8px;justify-content:center;align-items:center;
    padding:0 12px;background:rgba(11,24,17,.96);
    border-bottom:1px solid rgba(201,165,78,.20);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
  }
  #__subtab button{
    min-width:120px;padding:9px 22px;border:1px solid rgba(201,165,78,.30);border-radius:2px;
    background:transparent;color:#93a493;font-size:12px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;cursor:pointer;transition:.15s;
  }
  #__subtab button:hover{color:#ece3cf;border-color:#c9a54e;}
  #__subtab button.active{background:#c9a54e;color:#101d13;border-color:#c9a54e;}

  #__oldrow{
    position:fixed;top:50px;left:0;right:0;height:44px;z-index:99;display:none;
    align-items:center;justify-content:center;gap:8px;padding:0 12px;
    background:rgba(11,24,17,.96);border-bottom:1px solid rgba(201,165,78,.12);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
  }
  #__oldrow .lbl{color:#6f8172;font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-right:2px;}
  #__oldrow button{
    min-width:100px;padding:8px 18px;border:1px solid rgba(201,165,78,.25);border-radius:2px;
    background:transparent;color:#93a493;font-size:11px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;cursor:pointer;transition:.15s;
  }
  #__oldrow button:hover{color:#ece3cf;border-color:#c9a54e;}
  #__oldrow button.active{background:#7fb08a;color:#101d13;border-color:#7fb08a;}

  #__view{
    position:fixed;top:50px;left:0;right:0;
    width:100%;
    height:calc(100vh - 50px);
    height:calc(100dvh - 50px);
    border:0;display:block;background:#0b1811;
  }
  @media(max-width:520px){
    #__subtab button{min-width:0;flex:1;padding:9px 8px;letter-spacing:.1em;}
    #__oldrow button{min-width:0;flex:1;padding:8px 6px;letter-spacing:.08em;}
    #__oldrow .lbl{display:none;}
  }
</style>
</head>

</div>

function dec(b){var s=atob(b);var u=Uint8Array.from(s,function(c){return c.charCodeAt(0);});return new TextDecoder("utf-8").decode(u);}
var AUTOCONNECT_SHIM = '<script>(function(){var done=false;function go(){if(done)return;var b=document.getElementById("connectBtn");if(!b||typeof b.onclick!=="function"||!window.ethereum)return;window.ethereum.request({method:"eth_accounts"}).then(function(a){if(!done&&a&&a.length){done=true;try{b.click();}catch(e){}}}).catch(function(){});}function start(){go();var n=0,t=setInterval(function(){n++;go();if(done||n>80)clearInterval(t);},250);}if(document.readyState==="loading"){window.addEventListener("DOMContentLoaded",start);}else{start();}window.addEventListener("load",go);})();<\/script>';
function inject(doc){ return doc.replace(/<head([^>]*)>/i, "<head$1>"+AUTOCONNECT_SHIM); }
var frame=document.getElementById("__view");
var bar=document.getElementById("__subtab");
var oldrow=document.getElementById("__oldrow");
var topBtns=Array.prototype.slice.call(document.querySelectorAll("#__subtab button"));
var subBtns=Array.prototype.slice.call(document.querySelectorAll("#__oldrow button"));
var OLD_KEYS=["old1","old2"];
function isOld(k){return OLD_KEYS.indexOf(k)!==-1;}
var lastOld="old1";
var current="kavinew";

function layout(){
  var topH=bar.offsetHeight;
  oldrow.style.top=topH+"px";
  var subH=isOld(current)?oldrow.offsetHeight:0;
  var off=topH+subH;
  frame.style.top=off+"px";
  frame.style.height="calc(100dvh - "+off+"px)";
}

function show(k){
  if(!PAGES[k])k="kavinew";
  current=k;
  if(isOld(k))lastOld=k;
  topBtns.forEach(function(b){
    var dk=b.getAttribute("data-k");
    b.classList.toggle("active",(dk===k)||(dk==="old"&&isOld(k)));
  });
  if(isOld(k)){
    oldrow.style.display="flex";
    subBtns.forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-k")===k); });
  }else{
    oldrow.style.display="none";
  }
  layout();
  frame.srcdoc=inject(dec(PAGES[k]));
  try{ if(("#"+k)!==location.hash) history.replaceState(null,"","#"+k); }catch(e){}
}

topBtns.forEach(function(b){
  b.addEventListener("click",function(){
    var dk=b.getAttribute("data-k");
    show(dk==="old"?lastOld:dk);
  });
});
subBtns.forEach(function(b){
  b.addEventListener("click",function(){ show(b.getAttribute("data-k")); });
});
window.addEventListener("resize",layout);

var initKey=(location.hash||"").replace(/^#/,"");
show(PAGES[initKey]?initKey:"kavinew");
</script>
