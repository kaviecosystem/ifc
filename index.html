var frame=document.getElementById("__view");
var btns=Array.prototype.slice.call(document.querySelectorAll("#__subtab button"));
function show(k){
  if(!PAGES[k])k="new";
  frame.srcdoc=dec(PAGES[k]);
  btns.forEach(function(b){b.classList.toggle("active", b.getAttribute("data-k")===k);});
  try{ if(("#"+k)!==location.hash) history.replaceState(null,"","#"+k); }catch(e){}
}
